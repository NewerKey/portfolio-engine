baseURL = "https://newerkey.github.io/portfolio-engine/"
languageCode = "en-us"
title = "Yvette Nartey"
theme = "PaperMod"

[params]
  defaultTheme = "light"
  env = "production"
  description = "Infrastructure Support Engineer | Digital Garden"
  target = "Infrastructure, Cloud, Integration & Automation"

  # Minimalist Layout Settings
  [params.assets]
    disableHLJS = true

  [params.label]
    icon = "logoT.png"
    iconHeight = 160   
    text = ""

  # HomePage 
  [params.profileMode]
    enabled = true
    title = "Heya, I'm Yvette"
    subtitle = "I maintain, improve, and design reliable software systems—and keep an eye out for automation opportunities that give you back time and focus."

