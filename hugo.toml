baseURL = "https://YOUR-USERNAME.github.io/YOUR-REPO/"
languageCode = "en-us"
title = "Your Name"
theme = "PaperMod"

[params]
  defaultTheme = "light"
  env = "production"
  description = "Your Site Description"
  target = "My Portfolio"

  # Minimalist Layout Settings
  [params.assets]
    disableHLJS = true

  [params.label]
    icon = "logoT.jpg"
    iconHeight = 160   
    text = ""

  # HomePage 
  [params.profileMode]
    enabled = true
    title = "Hi, I'm [Name]"
    subtitle = "Welcome to my digital garden. This is a sub-title."

# ==========================
# Main Menu
# ==========================
[menu]

  # Top-level: About
  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = 10

  # Top-level: Projects
  [[menu.main]]
    identifier = "projects"
    name       = "Projects"
    url        = "/projects/"
    weight     = 20

  # Top-level: Blog (The Parent)
  [[menu.main]]
    identifier = "blog"
    name       = "Blog"
    url        = "/blog/"
    weight     = 30

  # ---- Blog submenus ----

  [[menu.main]]
    parent = "blog"
    name   = "Start here"
    url    = "/blog/start-here/"
    weight = 31

  [[menu.main]]
    parent = "blog"
    name   = "Cheatsheets"
    url    = "/blog/cheatsheets/"
    weight = 34

  [[menu.main]]
    parent = "blog"
    name   = "How I do things"
    url    = "/blog/how-i-do-things/"
    weight = 32

  [[menu.main]]
    parent = "blog"
    name   = "Deep Dives"
    url    = "/blog/deep-dives/"
    weight = 33