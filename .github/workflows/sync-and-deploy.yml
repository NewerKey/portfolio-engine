name: Build and Deploy Portfolio

on:
  # Allows external triggers (eg. From Obsidian Private Repo)
  repository_dispatch:
    types: [publish-event]
  # Allows manual button click in GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Engine (This Repo)
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Checkout Content (Your Private Obsidian Vault)
        uses: actions/checkout@v3
        with:
          repository: NewerKey/obsidian-portfolio-vault
          token: ${{ secrets.PAT_TOKEN }}
          path: temp_vault

      - name: Install obsidian-export
        run: |
          wget https://github.com/zoni/obsidian-export/releases/download/v23.12.0/obsidian-export-x86_64-unknown-linux-gnu.tar.xz
          tar -xf obsidian-export-x86_64-unknown-linux-gnu.tar.xz
          mv obsidian-export-x86_64-unknown-linux-gnu/obsidian-export ./obsidian-export
          chmod +x obsidian-export

      - name: Process Obsidian Files
        run: |
          mkdir temp_export
          ./obsidian-export temp_vault temp_export --frontmatter=always

          grep -rL "publish: true" temp_export | xargs -I {} rm "{}"

          rm -rf content
          mv temp_export content

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          publish_dir: ./public
